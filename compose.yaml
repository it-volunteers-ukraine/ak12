services:
  # Development service (uses Supabase cloud)
  dev:
    image: node:24-alpine
    working_dir: /workspace
    restart: unless-stopped
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    profiles:
      - dev

  # Production service (uses local PostgreSQL 17)
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - POSTGRES_HOST=database
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - default

  # Production database service (PostgreSQL 17)
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-ak12}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-ak12}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - default
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    entrypoint: >
      /bin/sh -c "
      if [ -z \"$$STORAGE_ACCESS_KEY\" ]; then
        echo 'STORAGE_ACCESS_KEY is required.';
        exit 1;
      fi;

      if [ -z \"$$STORAGE_SECRET_KEY\" ]; then
        echo 'STORAGE_SECRET_KEY is required.';
        exit 1;
      fi;

      if [ $${#STORAGE_SECRET_KEY} -lt 8 ]; then
        echo 'STORAGE_SECRET_KEY must be at least 8 characters long.';
        exit 1;
      fi;

      if [ -z \"$$STORAGE_BUCKET\" ]; then
        echo 'STORAGE_BUCKET is required.';
        exit 1;
      fi;

      for i in $$(seq 1 30); do
        if mc alias set minio http://minio:9000
        $$STORAGE_ACCESS_KEY $$STORAGE_SECRET_KEY; then
          mc mb --ignore-existing minio/$$STORAGE_BUCKET;
          exit 0;
        fi;

        echo 'Waiting for MinIO...';
        sleep 2;
      done;

      echo 'Failed to connect to MinIO after 60 seconds.';
      exit 1;
      "
    networks:
      - default

volumes:
  postgres_data:
  node_modules:
  minio_data:

networks:
  default:
    name: ak12-network
