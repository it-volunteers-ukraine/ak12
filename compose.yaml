services:
  # Development service (uses Supabase cloud)
  dev:
    image: node:24-alpine
    working_dir: /workspace
    restart: unless-stopped
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    profiles:
      - dev

  # Production service (uses local PostgreSQL 17)
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - POSTGRES_HOST=database
      - STORAGE_CLIENT=minio
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-ak12}
      - STORAGE_MEDIA_FOLDER=${STORAGE_MEDIA_FOLDER:-ak12}
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - default

  # Production database service (PostgreSQL 17)
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-ak12}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-ak12}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default

  minio:
    image: docker.io/elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - default
  minio-init:
    image: docker.io/rancher/mirrored-minio-mc:RELEASE.2023-06-28T21-54-17Z
    depends_on:
      minio:
        condition: service_started
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-ak12}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -u
        i=0
        until mc alias set minio http://minio:9000 "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -ge 30 ]; then
            echo "Failed to connect to MinIO after 60 seconds."
            exit 1
          fi
          echo "Waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing "minio/$$STORAGE_BUCKET"
    networks:
      - default

volumes:
  postgres_data:
  node_modules:
  minio_data:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-ak12}-network
